name: MT5 phone app

on:
  push:
    branches: [claude/mt5-interface-nddvnf]
    paths: [mt5-app/**, .github/workflows/mt5-app.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: mt5-app
        run: gradle --no-daemon assembleDebug
      - run: cp mt5-app/app/build/outputs/apk/debug/app-debug.apk MT5-Scalper.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MT5-Scalper-apk
          path: MT5-Scalper.apk
      - name: Publish as a downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mt5-app-latest --yes --cleanup-tag || true
          gh release create mt5-app-latest MT5-Scalper.apk --prerelease \
            --target "${{ github.sha }}" --title "MT5 Scalper phone app" \
            --notes "Remote control for the MT5 scalper. Install on Android; the bot runs on your Windows PC/VPS."
